name: TF Upload to App Store
on:
  workflow_dispatch:
    inputs:
      task_id: {description: Task ID, required: true}
      signed_ipa_url: {description: Signed IPA URL, required: true}
      apple_id: {description: Apple ID, required: true}
      apple_password: {description: App Password, required: true}
      cert_url: {description: Certificate URL, required: false, default: ''}
      key_url: {description: Private Key URL, required: false, default: ''}
      profile_url: {description: Profile URL, required: false, default: ''}
      bundle_id: {description: Bundle ID, required: false, default: ''}
jobs:
  upload:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    steps:
      - name: Download IPA
        run: |
          curl -fsSLo signed.ipa "${{ inputs.signed_ipa_url }}" || { echo 'IPA download failed'; exit 1; }
          ls -lh signed.ipa

      - name: Download cert/profile and re-sign with codesign
        run: |
          echo 'Downloading cert/key/profile...'
          curl -fsSLo cert.pem "${{ inputs.cert_url }}" || { echo 'Cert download failed'; exit 1; }
          curl -fsSLo key.pem "${{ inputs.key_url }}" || { echo 'Key download failed'; exit 1; }
          curl -fsSLo profile.mobileprovision "${{ inputs.profile_url }}" || { echo 'Profile download failed'; exit 1; }
          ls -lh cert.pem key.pem profile.mobileprovision

          echo 'Creating P12...'
          openssl pkcs12 -export -nomac -in cert.pem -inkey key.pem -out cert.p12 -passout pass:temp123

          echo 'Importing into keychain...'
          security create-keychain -p temp123 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp123 build.keychain
          security import cert.p12 -k build.keychain -P temp123 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temp123 build.keychain
          echo "=== Debug: keychain identities ==="
          security find-identity -v -p codesigning build.keychain 2>&1 || true
          security find-identity -v -p codesigning build.keychain | grep -E 'Apple Distribution|iPhone Distribution' | head -1 | awk '{print $2}' > SIGN_IDENTITY
          if [ ! -s SIGN_IDENTITY ]; then
            echo "WARNING: No SHA-1 identity, trying by name..."
            security find-identity -v -p codesigning build.keychain 2>&1 | grep -oE "iPhone Distribution: [^"]+|Apple Distribution: [^"]+" | head -1 > SIGN_IDENTITY
          fi
          if [ ! -s SIGN_IDENTITY ]; then echo "FATAL: No identity!"; exit 1; fi
          echo "Sign identity: $(cat SIGN_IDENTITY)"

          echo 'Extracting IPA...'
          rm -rf Payload
          unzip -q signed.ipa

          APP=$(ls -d Payload/*.app | head -1)
          echo "App: $APP"

          cp profile.mobileprovision "$APP/embedded.mobileprovision"

          security cms -D -i profile.mobileprovision > profile.plist
          /usr/libexec/PlistBuddy -x -c "Print Entitlements" profile.plist > entitlements.plist

          BID="${{ inputs.bundle_id }}"
          if [ -n "$BID" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BID" "$APP/Info.plist"
          fi

          echo 'Signing frameworks and plugins...'
          for fw in "$APP/Frameworks/"*.framework "$APP/PlugIns/"*.appex; do
            [ -d "$fw" ] || continue
            /usr/bin/codesign --force --sign "$(cat SIGN_IDENTITY)" --timestamp=none "$fw" || { echo "FAILED sign framework"; exit 1; }
          done

          echo 'Signing main app...'
          /usr/bin/codesign --force --sign "$(cat SIGN_IDENTITY)" --entitlements entitlements.plist --timestamp=none "$APP" || { echo "FAILED sign main app"; exit 1; }

          echo 'Verifying signature...'
          /usr/bin/codesign -dvvv "$APP" 2>&1 || { echo "FAILED verify"; exit 1; }

          echo 'Re-packaging...'
          rm -f signed.ipa
          zip -qr signed.ipa Payload
          ls -lh signed.ipa

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build.keychain 2>/dev/null; true

      - name: Upload to App Store
        run: |
          xcrun altool --upload-app --file signed.ipa --upload-bundle signed.ipa --type ios -u "${{ inputs.apple_id }}" -p "${{ inputs.apple_password }}" --output-format json > upload_result.json 2>&1
          cat upload_result.json

      - name: Callback
        if: always()
        run: |
          cat > callback.py << 'PYEOF'
          import json, subprocess, sys, os
          task_id = sys.argv[1]
          url = f'https://bsj.appssign.cc/api/tasks/{task_id}/callback'
          msg = 'Upload failed'
          if os.path.exists('upload_result.json'):
              raw = open('upload_result.json').read()
              idx = raw.find('{')
              if idx >= 0:
                  try:
                      d = json.loads(raw[idx:])
                      sc = d.get('statusCode', 'unknown')
                      if str(sc) == '0':
                          payload = json.dumps({'status': 'completed', 'result': 'Upload OK'})
                          subprocess.run(['curl', '-s', '-X', 'POST', url, '-H', 'Content-Type: application/json', '-d', payload])
                          sys.exit(0)
                      errs = d.get('product-errors', d.get('errors', []))
                      msg = errs[0].get('message', str(errs[0])) if errs else d.get('statusMessage', str(d))
                  except Exception as e:
                      for line in raw.split('\n'):
                          if 'ERROR:' in line:
                              msg = line.split('ERROR:', 1)[-1].strip()[:500]
                              break
              else:
                  for line in raw.split('\n'):
                      if 'ERROR:' in line or 'error:' in line.lower():
                          msg = line.strip()[:500]
                          break
          payload = json.dumps({'status': 'failed', 'error': str(msg)[:500]})
          subprocess.run(['curl', '-s', '-X', 'POST', url, '-H', 'Content-Type: application/json', '-d', payload])
          PYEOF
          python3 callback.py ${{ inputs.task_id }}

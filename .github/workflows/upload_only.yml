name: TF Upload to App Store
on:
  workflow_dispatch:
    inputs:
      task_id: {description: Task ID, required: true}
      signed_ipa_url: {description: Signed IPA URL, required: true}
      apple_id: {description: Apple ID, required: true}
      apple_password: {description: App Password, required: true}
jobs:
  upload:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    steps:
      - name: Download IPA
        run: curl -sLo signed.ipa "${{ inputs.signed_ipa_url }}" && ls -lh signed.ipa
      - name: Upload to App Store
        run: |
          xcrun altool --upload-package signed.ipa -u "${{ inputs.apple_id }}" -p "${{ inputs.apple_password }}" --output-format json > upload_result.json 2>&1
          cat upload_result.json
      - name: Callback
        if: always()
        run: |
          cat > callback.py << 'PYEOF'
          import json, subprocess, sys, os
          task_id = sys.argv[1]
          url = f'https://bsj.appssign.cc/api/tasks/{task_id}/callback'
          msg = 'Upload failed'
          if os.path.exists('upload_result.json'):
              raw = open('upload_result.json').read()
              idx = raw.find('{')
              if idx >= 0:
                  try:
                      d = json.loads(raw[idx:])
                      sc = d.get('statusCode', 'unknown')
                      if str(sc) == '0':
                          payload = json.dumps({'status': 'completed', 'result': 'Upload OK'})
                          subprocess.run(['curl', '-s', '-X', 'POST', url, '-H', 'Content-Type: application/json', '-d', payload])
                          sys.exit(0)
                      errs = d.get('product-errors', d.get('errors', []))
                      msg = errs[0].get('message', str(errs[0])) if errs else d.get('statusMessage', str(d))
                  except Exception as e:
                      for line in raw.split('\n'):
                          if 'ERROR:' in line:
                              msg = line.split('ERROR:', 1)[-1].strip()[:500]
                              break
              else:
                  for line in raw.split('\n'):
                      if 'ERROR:' in line or 'error:' in line.lower():
                          msg = line.strip()[:500]
                          break
          payload = json.dumps({'status': 'failed', 'error': str(msg)[:500]})
          subprocess.run(['curl', '-s', '-X', 'POST', url, '-H', 'Content-Type: application/json', '-d', payload])
          PYEOF
          python3 callback.py ${{ inputs.task_id }}
